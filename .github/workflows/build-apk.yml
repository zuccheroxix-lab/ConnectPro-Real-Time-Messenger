name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 4. Build Debug APK
        run: |
          echo "Building Debug APK..."
          gradle assembleDebug --stacktrace

      - name: 5. Prepare Release Signing Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Using custom release signing keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASS=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
          else
            echo "Generating CI upload keystore for release packaging..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PulseChat Release,O=ConnectPro,C=ID"
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
            echo "KEY_ALIAS_VAL=upload" >> $GITHUB_ENV
          fi

      - name: 6. Build Release APK
        run: |
          echo "Building Release APK..."
          STORE_PASSWORD="${{ env.STORE_PASS }}" KEY_PASSWORD="${{ env.KEY_PASS }}" gradle assembleRelease --stacktrace

      - name: 7. Verify APK Files & Sizes
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          echo "Verifying APK files..."
          if [ ! -f "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "::error::File app-debug.apk tidak ditemukan atau kosong!"
            exit 1
          fi

          if [ ! -f "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "::error::File app-release.apk tidak ditemukan atau kosong!"
            exit 1
          fi

          echo "========================================="
          echo "APK VERIFICATION SUCCESSFUL:"
          echo "DEBUG APK:   $(ls -lh $DEBUG_APK)"
          echo "RELEASE APK: $(ls -lh $RELEASE_APK)"
          echo "========================================="

      - name: 8. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 9. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 10. Publish GitHub Release with Real APK Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
